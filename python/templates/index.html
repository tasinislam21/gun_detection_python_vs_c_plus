<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Stream</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.0/socket.io.js"></script>
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="container text-center">
        <h1 class="display-4 mb-4">Video Stream</h1>
        <div class="row justify-content-center mb-4">
            <div class="col-auto">
               <video id="video"
                   width="640"
                   height="640"
                   autoplay
                   loop
                   muted
                   playsinline
                   preload="auto"
                   style="visibility:hidden; position:absolute; left:-9999px;">
                   <source src="{{ url_for('static', filename='evaluation.mp4') }}" type="video/mp4">
               </video>

            </div>
        </div>
        <div id="imageContainer" class="row justify-content-center"></div>
    </div>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
	<script src="{{ url_for('static', filename='video_process.js') }}"></script>

</body>
</html>
